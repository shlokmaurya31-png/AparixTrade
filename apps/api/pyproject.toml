[project]
name = "aparix-api"
version = "0.1.0"
description = "Aparix API — FastAPI backend (Phase 1 foundation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "greenlet>=3.1",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Both "session" (not the default "function") — required for a real async
# driver against a module-level engine singleton (app/core/db.py). SQLite/
# aiosqlite tolerates a fresh event loop per test; a real asyncpg
# connection pool does not — reusing it across a NEW per-test event loop
# raises "Task ... got Future ... attached to a different loop". Caught
# only by actually running this suite against a real Postgres instance
# (Tier 1 §5 verification), not by the SQLite-only test history every
# prior session's own verification had. See docs/DATABASE_MIGRATION.md.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
